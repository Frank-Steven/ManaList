name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 固定版本：stable 浮动会让 analyze 结果随上游升级漂移
          # （3.47.9 起把 package:flutter/material.dart 判为 deprecated，
          #  全仓 86 条 info 直接让 flutter analyze 失败）。
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 静态检查
        run: flutter analyze
      - name: 单元测试
        run: flutter test --reporter expanded

  desktop:
    name: desktop (tsc + node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # CI 只跑 tsc 与单元测试，不需要 electron 二进制约 100MB
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 依赖
        run: npm ci
      - name: 类型检查与构建
        run: npm run build
      - name: 单元测试
        run: npx tsx --test src/*.test.ts src/ai/*.test.ts
